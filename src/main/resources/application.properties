spring.application.name=essalud-gcpp-backend
# Carga variables desde .env
spring.config.import=optional:file:.env[.properties],optional:file:./.env[.properties]

# Base principal
spring.datasource.first.jdbc-url=${SPRING_DATASOURCE_FIRST_URL}
spring.datasource.first.username=${SPRING_DATASOURCE_FIRST_USERNAME}
spring.datasource.first.password=${SPRING_DATASOURCE_FIRST_PASSWORD}
spring.datasource.first.driver-class-name=org.postgresql.Driver
spring.datasource.first.jpa.hibernate.ddl-auto=update
spring.datasource.first.jpa.show-sql=false

# Base secundaria (solo consultas)
spring.datasource.second.jdbc-url=${SPRING_DATASOURCE_SECOND_URL}
spring.datasource.second.username=${SPRING_DATASOURCE_SECOND_USERNAME}
spring.datasource.second.password=${SPRING_DATASOURCE_SECOND_PASSWORD}
spring.datasource.second.driver-class-name=org.postgresql.Driver
spring.datasource.second.jpa.hibernate.ddl-auto=none
spring.datasource.second.jpa.show-sql=false
spring.jpa.open-in-view=false

#Base de datos oracle
spring.datasource.firstoracle.jdbc-url=${SPRING_DATASOURCE_FIRST_ORACLE_URL}
spring.datasource.firstoracle.username=${SPRING_DATASOURCE_FIRST_ORACLE_USERNAME}
spring.datasource.firstoracle.password=${SPRING_DATASOURCE_FIRST_ORACLE_PASSWORD}
spring.datasource.firstoracle.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.firstoracle.jpa.hibernate.ddl-auto=none
spring.datasource.firstoracle.jpa.show-sql=false
    #spring.jpa.open-in-view=false

#media.location=mediafiles

# JWT
app.security.jwt.issuer=essalud-gcpp-backend
app.security.jwt.access-secret=${APP_SECURITY_JWT_ACCESS_SECRET}
app.security.jwt.api-secret=${APP_SECURITY_JWT_API_SECRET}

# CORS (Angular)
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS}

# Cookie JWT
app.security.cookie.access.name=access_token
app.security.cookie.api.name=api_token
app.security.cookie.api.path=/
app.security.cookie.secure=false
app.security.cookie.same-site=Lax

# JWT TTL
app.security.jwt.access-token-validity-ms=900000
app.security.jwt.api-token-validity-ms=604800000

# Upload de archivos
#spring.servlet.multipart.max-file-size=1000MB
#spring.servlet.multipart.max-request-size=1000MB

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1000MB

server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=1000MB

server.port=8080
server.servlet.context-path=/ggi